name: Update Date Added Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create date-added index
        run: |
          echo "# Date Added Index" > DATE_ADDED_INDEX.md
          echo "" >> DATE_ADDED_INDEX.md
          echo "Newest files first." >> DATE_ADDED_INDEX.md
          echo "" >> DATE_ADDED_INDEX.md

          git ls-files | while read file; do
            if [ "$file" != "DATE_ADDED_INDEX.md" ] && [ "$file" != ".github/workflows/update-date-added-index.yml" ]; then
              added_date=$(git log --diff-filter=A --follow --format="%ad" --date=short -- "$file" | tail -1)
              encoded_file=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$file")
              echo "- **$added_date** - [$file]($encoded_file)" >> DATE_ADDED_INDEX.md
            fi
          done | sort -r > sorted-files.txt

          cat sorted-files.txt >> DATE_ADDED_INDEX.md
          rm sorted-files.txt

      - name: Commit updated index
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add DATE_ADDED_INDEX.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update date added index"
            git pull --rebase origin main
            git push
          fi
